spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
  application:
    name: school

  # PostgreSQL database configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/school_manager
    username: postgres
    password: root

  # JPA configurations
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update