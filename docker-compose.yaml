version: '3.8'

services:
  # The PostgreSQL Database service
  database:
    image: postgres:15-alpine
    container_name: school_db
    environment:
      POSTGRES_DB: school_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # The Spring Boot Application service
  app:
    build: .
    container_name: school_app
    ports:
      - "8080:8080"
    depends_on:
      - database
    environment:
      # Override the localhost URL to point to the database container
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/school_manager
      SPRING_OUTPUT_ANSI_ENABLED: ALWAYS

volumes:
  postgres_data: